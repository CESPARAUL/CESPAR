# Redeploy the API on Render whenever server code lands on main.
# Backup for Render's own Auto-Deploy: needs the service's Deploy Hook URL
# (Render -> cespar-api -> Settings -> Deploy Hook) saved as the repo
# secret RENDER_DEPLOY_HOOK_URL. Without the secret this job just skips.
name: Deploy API to Render

on:
  push:
    branches: [main]
    paths: ["server/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL isn't set - skipping (Render's own Auto-Deploy may still deploy)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Render deploy triggered."
