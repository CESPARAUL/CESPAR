<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background:#05070f;">
    <div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; background: #05070f; color: #e9ecf5;">
      <p style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #ef4452; margin: 0 0 16px;">CESPAR &middot; Anchor University Lagos</p>
      <h1 style="font-size: 20px; margin: 0 0 16px;">Verify your email</h1>
      <p style="font-size: 14px; line-height: 1.6; color: #c7cbd8; margin: 0 0 24px;">Hi {{ user.name }}, use the code below to verify your account and finish signing up for CESPAR research data access.</p>
      <div style="font-size: 32px; font-weight: 700; letter-spacing: 0.3em; text-align: center; background: #131c34; border-radius: 12px; padding: 20px; margin: 0 0 24px;">{{ code }}</div>
      <p style="font-size: 13px; color: #8b90a3; margin: 0;">This code expires in {{ minutes }} minutes. If you didn't request this, you can safely ignore this email.</p>
    </div>
  </body>
</html>
